<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - 403</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
<div class="text-center p-4">
    <i class="bi bi-shield-slash text-danger display-1 mb-3"></i>
    <h1 class="fw-bold text-dark">403 - Access Denied</h1>
    <p class="text-secondary lead">You do not have the required role or authorization to access this resource.</p>
    <a th:href="@{/login}" class="btn btn-primary mt-3 px-4 py-2">
        <i class="bi bi-arrow-left me-1"></i> Return to Login
    </a>
</div>
</body>
</html>
