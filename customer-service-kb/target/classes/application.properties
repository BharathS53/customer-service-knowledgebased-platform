# ===================================================================
# Application Configuration: Customer Service Knowledge-Based Platform
# ===================================================================
spring.application.name=customer-service-kb
server.port=8081

# ===================================================================
# MySQL Database Connection (MySQL Workbench / Server)
# Adjust username and password as per your local MySQL configuration
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/customer_service_kb?useSSL=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=kbuser
spring.datasource.password=kbpassword123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# Hibernate & JPA Configuration
# Note: In Phase 1 & 2 we use 'none' or 'update' to avoid auto-dropping normalized schema
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# Thymeleaf Template Engine Configuration
# ===================================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ===================================================================
# Static Resources Configuration
# ===================================================================
spring.web.resources.static-locations=classpath:/static/

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.root=INFO
logging.level.com.example.customerservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
