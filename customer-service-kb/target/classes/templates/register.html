<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration &bull; KB Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.22) 0%, transparent 45%),
                        radial-gradient(circle at 85% 85%, rgba(37, 99, 235, 0.2) 0%, transparent 45%),
                        #0b0f19;
            padding: 30px 15px;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 540px;
        }
        .brand-badge {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
            font-size: 1.6rem;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="p-4 p-sm-5">
        <div class="text-center mb-4">
            <div class="brand-badge mb-3">
                <i class="bi bi-person-plus"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Create Customer Account</h3>
            <p class="text-secondary small mb-0">Join the support platform to track issues and access verified solutions</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small rounded-3 mb-3 d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2 fs-6"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. John Doe" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" th:field="*{username}" class="form-control" placeholder="Choose username" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="Min. 6 characters" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="col-md-6 mb-4">
                    <label class="form-label">Phone Number (Optional)</label>
                    <input type="tel" th:field="*{phoneNumber}" class="form-control" placeholder="+1-555-0199">
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-3 shadow-sm fs-6">
                Create Account <i class="bi bi-arrow-right ms-1"></i>
            </button>
        </form>

        <div class="mt-4 text-center">
            <span class="text-muted small">Already have an account? </span>
            <a th:href="@{/login}" class="text-primary fw-semibold small text-decoration-none">
                Sign In &rarr;
            </a>
        </div>
    </div>
</div>

</body>
</html>
