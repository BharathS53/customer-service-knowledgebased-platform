<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Service KB Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <div class="container py-5 text-center">
        <div class="card shadow-sm mx-auto" style="max-width: 650px;">
            <div class="card-body p-5">
                <span class="badge bg-primary mb-3 px-3 py-2 fs-6">Phase 1 Initialized</span>
                <h2 class="card-title fw-bold text-primary">Customer Service Knowledge-Based Platform</h2>
                <p class="text-secondary mt-3">
                    Spring Boot 3 + Hibernate ORM + Spring Security + MySQL Workbench Foundation.
                </p>
                <hr class="my-4">
                <div class="text-start">
                    <p class="mb-1"><strong>Status:</strong> <span class="text-success">Operational</span></p>
                    <p class="mb-1"><strong>Health API:</strong> <code>/api/health</code></p>
                    <p class="mb-0"><strong>Ready for:</strong> Phase 2 (MySQL Database Creation and Design)</p>
                </div>
            </div>
        </div>
    </div>
