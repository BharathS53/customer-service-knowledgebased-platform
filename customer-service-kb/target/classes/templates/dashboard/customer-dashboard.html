<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Help Desk - KB Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body>

<!-- Top Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success px-4 shadow-sm">
    <a class="navbar-brand fw-bold text-white" th:href="@{/customer/dashboard}">
        <i class="bi bi-life-preserver me-2"></i>Customer Support Portal
    </a>
    <div class="ms-auto d-flex align-items-center">
        <span class="badge bg-light text-success me-3 px-3 py-2"><i class="bi bi-person-fill me-1"></i>CUSTOMER</span>
        <span class="text-white me-3 small" th:text="${user.fullName} + ' (' + ${user.username} + ')'"></span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </form>
    </div>
</nav>

<div class="container py-4">
    <div class="p-4 mb-4 bg-white rounded-3 shadow-sm border">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h3 class="fw-bold text-dark mb-1">Hello, <span th:text="${user.fullName}">Customer</span>!</h3>
                <p class="text-muted mb-0">Track your support requests, submit new inquiries, and browse verified solutions.</p>
            </div>
            <div class="col-md-4 text-md-end mt-3 mt-md-0">
                <span class="badge bg-success py-2 px-3 fs-6"><i class="bi bi-shield-check me-1"></i>Customer Portal Active</span>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- My Tickets Column -->
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-ticket-detailed text-primary me-2"></i>My Support Tickets</h5>
                    <span class="badge bg-primary" th:text="${myTickets.size()} + ' Tickets'"></span>
                </div>
                <div class="card-body p-0">
                    <div th:if="${myTickets.isEmpty()}" class="p-4 text-center text-muted">
                        <i class="bi bi-inbox fs-1 mb-2 d-block text-secondary"></i>
                        You have not submitted any support tickets yet.
                    </div>
                    <div th:unless="${myTickets.isEmpty()}" class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3">Ticket #</th>
                                    <th>Subject</th>
                                    <th>Status</th>
                                    <th>Updated</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="ticket : ${myTickets}">
                                    <td class="ps-3 fw-semibold text-primary" th:text="${ticket.ticketNumber}"></td>
                                    <td th:text="${ticket.issueTitle}"></td>
                                    <td>
                                        <span class="badge" th:classappend="${ticket.status == 'RESOLVED' ? 'bg-success' : (ticket.status == 'IN_PROGRESS' ? 'bg-warning text-dark' : 'bg-primary')}" th:text="${ticket.status}"></span>
                                    </td>
                                    <td class="small text-muted" th:text="${#temporals.format(ticket.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- FAQs & Solutions Column -->
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-question-circle text-success me-2"></i>Frequently Asked Questions</h5>
                </div>
                <div class="card-body">
                    <div class="accordion accordion-flush" id="faqAccordion">
                        <div th:each="faq, iterStat : ${faqs}" class="accordion-item">
                            <h2 class="accordion-header" th:id="'heading' + ${iterStat.index}">
                                <button class="accordion-button collapsed fw-semibold text-dark small" type="button" data-bs-toggle="collapse" th:attr="data-bs-target='#collapse' + ${iterStat.index}">
                                    <span th:text="${faq.title}"></span>
                                </button>
                            </h2>
                            <div th:id="'collapse' + ${iterStat.index}" class="accordion-collapse collapse" data-bs-parent="#faqAccordion">
                                <div class="accordion-body small text-secondary">
                                    <p class="mb-2" th:text="${faq.description}"></p>
                                    <div class="p-2 bg-light rounded border">
                                        <strong class="d-block text-dark mb-1">Solution:</strong>
                                        <pre class="mb-0 text-dark" style="white-space: pre-wrap; font-family: inherit;" th:text="${faq.stepByStepSolution}"></pre>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
