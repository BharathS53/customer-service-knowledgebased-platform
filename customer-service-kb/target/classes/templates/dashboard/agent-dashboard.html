<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Agent Portal - Customer Service KB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body>

<!-- Top Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-4 shadow-sm">
    <a class="navbar-brand fw-bold text-white" th:href="@{/agent/dashboard}">
        <i class="bi bi-headset me-2"></i>Support Agent Portal
    </a>
    <div class="ms-auto d-flex align-items-center">
        <span class="badge bg-light text-primary me-3 px-3 py-2"><i class="bi bi-person-badge-fill me-1"></i>SUPPORT AGENT</span>
        <span class="text-white me-3 small" th:text="${user.fullName} + ' (' + ${user.username} + ')'"></span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
        </form>
    </div>
</nav>

<div class="container-fluid px-4 py-4">
    <div class="row g-4">
        <!-- Assigned Tickets Column -->
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-inbox-fill text-primary me-2"></i>My Assigned Tickets</h5>
                    <span class="badge bg-primary" th:text="${assignedTickets.size()} + ' Assigned'"></span>
                </div>
                <div class="card-body p-0">
                    <div th:if="${assignedTickets.isEmpty()}" class="p-4 text-center text-muted">
                        <i class="bi bi-emoji-smile fs-1 mb-2 d-block text-secondary"></i>
                        No open tickets currently assigned to you!
                    </div>
                    <div th:unless="${assignedTickets.isEmpty()}" class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3">Ticket #</th>
                                    <th>Customer</th>
                                    <th>Issue</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="ticket : ${assignedTickets}">
                                    <td class="ps-3 fw-semibold text-primary" th:text="${ticket.ticketNumber}"></td>
                                    <td th:text="${ticket.customerName}"></td>
                                    <td th:text="${ticket.issueTitle}"></td>
                                    <td>
                                        <span class="badge" th:classappend="${ticket.priority == 'HIGH' or ticket.priority == 'CRITICAL' ? 'bg-danger' : 'bg-secondary'}" th:text="${ticket.priority}"></span>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${ticket.status == 'RESOLVED' ? 'bg-success' : 'bg-warning text-dark'}" th:text="${ticket.status}"></span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Knowledge Base Column -->
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-book-half text-success me-2"></i>Knowledge Base Solutions</h5>
                    <span class="badge bg-success" th:text="${recentArticles.size()} + ' Published'"></span>
                </div>
                <div class="card-body">
                    <div class="list-group list-group-flush">
                        <div th:each="article : ${recentArticles}" class="list-group-item px-0 py-3">
                            <div class="d-flex w-100 justify-content-between align-items-center mb-1">
                                <h6 class="mb-0 fw-bold text-dark" th:text="${article.title}"></h6>
                                <span class="badge bg-light text-dark border small" th:text="${article.categoryName}"></span>
                            </div>
                            <p class="mb-2 text-muted small" th:text="${article.description}"></p>
                            <div>
                                <span th:each="tag : ${article.tags}" class="badge bg-secondary-subtle text-secondary border me-1 small" th:text="'#' + ${tag}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
